[package]
name = "udm-updater-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Per-user trampoline that finishes an update swap after UDM exits"

[[bin]]
name = "udm-updater-helper"
path = "src/main.rs"

[[test]]
name = "helper_fallback"
harness = false

[dependencies]
usagi = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
ring = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }
