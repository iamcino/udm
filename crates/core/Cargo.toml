[package]
name = "usagi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Usagi download engine: HTTP/1.1+2 and HTTP/3 (QUIC) transports, segmented transfers, resume, checksums, redb persistence"
keywords = ["download", "http3", "quic", "downloader"]
categories = ["network-programming"]

[dependencies]
blake3 = { workspace = true }
bytes = { workspace = true }
dunce = { workspace = true }
flume = { workspace = true }
futures-util = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
md-5 = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = { workspace = true }
quinn = { workspace = true }
redb = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# I1 dev harness only. These crates are not linked into `udm` or `udm-cli`.
# `ring` matches the process crypto provider; aws-lc-rs stays out.
rcgen = { version = "0.13.2", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# I4 spike only. Already locked through reqwest 0.13.5. Exact versions so the
# experiment cannot float off hyper-util 0.1.21, hyper 1.12.0, h2 0.4.20, or
# hyper-rustls 0.27.10. `default-features = false` keeps aws-lc-rs out.
h2 = "=0.4.20"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "http2", "client"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "http2", "tls12"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["http1", "http2", "client", "client-legacy", "tokio"] }
tower-layer = "=0.3.3"
tower-service = "=0.3.3"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_Storage_FileSystem"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
