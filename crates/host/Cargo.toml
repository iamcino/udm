[package]
name = "udm-host"
version.workspace = true
edition = "2021"
license.workspace = true
description = "udm browser handoff host (Native Messaging bridge to the coordinator pipe)"
publish = false

[[bin]]
name = "udm-host"
path = "src/main.rs"

[dependencies]
usagi = { path = "../core" }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Registry"] }

[dev-dependencies]
tempfile = { workspace = true }
