# `cargo deny check bans` enforces the "no telemetry" rule at the dependency
# level. Run it in CI: `cargo deny --manifest-path Cargo.toml check bans licenses sources`
#
# Everything below is denied because it either phones home, collects
# diagnostics, or pulls in a second TLS/crypto stack we deliberately avoid.
#
# Browser integration (envelope rev.5, 2026-11-15) curation map, settled in
# the CI adjudication of 2026-11-14. A local cargo-deny run on the
# un-curated tree exits 7 with advisories, bans and licenses failing,
# sources ok, and NO vulnerability advisories.
#
# schannel is NOT banned, with this recorded rationale: schannel 0.1.30
# appears in the lock only under rustls-native-certs 0.8.5, which is how
# the Windows trust store is read; the lock contains no native-tls or
# openssl. The bans on native-tls and openssl-sys stay.
#
# LicenseRef-Slint-Royalty-free-2.0 is allowed ONLY in combination with
# the thirteen [[licenses.clarify]] entries below, never as a blanket
# LicenseRef allow. The thirteen license files are byte-identical on
# this tree (one shared XxHash32 file hash serves all thirteen entries;
# if any crate's file ever differs, it gets its own entry with its own
# hash). The hash is cargo-deny's XxHash32 file hash (0x + eight hex
# digits), NOT a SHA-256.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # pin-utils 0.1.1, unmaintained. Parent chain: spin_on from
    # slint-build, slint-macros, i-slint-renderer-skia.
    { id = "RUSTSEC-2026-0441", reason = "unmaintained pin-utils 0.1.1, via spin_on from slint-build, slint-macros, i-slint-renderer-skia" },
    # proc-macro-error 1.0.4, unmaintained. Parent chain: glib-macros and
    # gtk3-macros on the Linux tray path through glib and libappindicator.
    # (proc-macro-error-attr has no advisory.)
    { id = "RUSTSEC-2024-0370", reason = "unmaintained proc-macro-error 1.0.4, via glib-macros and gtk3-macros on the Linux tray path through glib and libappindicator" },
    # bincode 2.0.1, unmaintained. Parent chain: typed-index-collections
    # from i-slint-compiler.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained bincode 2.0.1, via typed-index-collections from i-slint-compiler" },
    # ttf-parser 0.25.1, unmaintained. Parent chain: owned_ttf_parser.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained ttf-parser 0.25.1, via owned_ttf_parser" },
    # zvariant 5.15.1, unmaintained. Parent chain: zbus 5.19.0 from ashpd
    # and i-slint-backend-winit.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained zvariant 5.15.1, via zbus 5.19.0 from ashpd and i-slint-backend-winit" },
    # zbus_names 4.3.5, unmaintained. Parent chain: zbus 5.19.0 from ashpd
    # and i-slint-backend-winit.
    { id = "RUSTSEC-2026-0371", reason = "unmaintained zbus_names 4.3.5, via zbus 5.19.0 from ashpd and i-slint-backend-winit" },
    # zvariant_derive 5.15.1, unmaintained. Parent chain: zbus 5.19.0 from
    # ashpd and i-slint-backend-winit.
    { id = "RUSTSEC-2026-0372", reason = "unmaintained zvariant_derive 5.15.1, via zbus 5.19.0 from ashpd and i-slint-backend-winit" },
    # glib 0.18.5, UNSOUND (not unmaintained) - the map's one judgment
    # call, flagged for the gate. glib is reached from tray-icon 0.21.3
    # by two edges: libappindicator 0.9.0 (target_os = linux) and muda
    # 0.17.2 with its gtk feature (gtk itself cfg-gated to Linux and the
    # BSDs); udm-gui depends on tray-icon only under cfg(windows), so
    # neither edge is compiled into the Windows product this package
    # ships. The patched line (>= 0.20.0) would require a dependency
    # upgrade, which this package forbids. This ignore dies the day the
    # Linux tray path ships or the lock moves glib.
    { id = "RUSTSEC-2024-0429", reason = "unsound glib 0.18.5, reached from tray-icon 0.21.3 only via libappindicator 0.9.0 (target_os = linux) and muda 0.17.2 gtk feature (gtk cfg-gated to Linux/BSDs); udm-gui depends on tray-icon only under cfg(windows), so neither edge is compiled into the Windows product; patched line >= 0.20.0 would require a forbidden dependency upgrade" },
]

