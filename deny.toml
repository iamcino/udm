allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "MPL-2.0", "Zlib", "OpenSSL", "BSL-1.0", "CDLA-Permissive-2.0", "LicenseRef-Slint-Royalty-free-2.0"]
